<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture notes — PostgreSQL Master</title>
<meta name="description" content="The slide decks handed out alongside the lectures: data modelling, joins, set operations, subqueries and normalisation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234d9bff' stroke-width='2'%3E%3Cellipse cx='12' cy='5.5' rx='8' ry='3'/%3E%3Cpath d='M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/notes.css">
<style>.nthost{flex:1; min-height:0; display:flex; flex-direction:column}</style>
</head>
<body class="fixed">

<header data-shell></header>

<div data-ctx></div>

<main>
<div class="fillhost">
  <div class="wrap">
    <section class="ntmod" id="ntmod" data-fs-target aria-label="Lecture notes console">

      <div class="nt-boot" id="ntBoot">
        <button class="nt-power" id="ntPower" type="button" aria-label="Open the lecture notes">
          <span class="ring dash" aria-hidden="true"></span>
          <span class="ring glow" aria-hidden="true"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/>
          </svg>
        </button>
        <div class="cap">Lecture notes</div>
        <p class="sub">Six decks from the lectures. Press to open the console — then pick a topic
          from the rail and the deck loads in place.</p>
      </div>

      <div class="nt-shell" id="ntShell" hidden>
        <nav class="nt-rail" aria-label="Topics">
          <div class="hd">Modules</div>
          <div class="nt-list" id="ntList"></div>
        </nav>
        <div class="nt-screen">
          <div class="nt-bezel">
            <div class="nt-bar">
              <span class="dot" aria-hidden="true"></span>
              <span class="ttl" id="ntTitle"></span>
              <span class="fill"></span>
              <span class="nt-page" id="ntPage"></span>
            </div>
            <div class="nt-stage"><div class="nt-frame" id="ntFrame"></div></div>
            <p class="nt-blurb" id="ntBlurb"></p>
          </div>
        </div>
      </div>

    </section>
  </div>
</div>
</main>

<footer data-shell></footer>

<script src="assets/shell.js"></script>
<script src="assets/notes.js"></script>
<script>
  Shell.mount("notes");
  Shell.ctx("notes");

  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var boot = $("ntBoot"), shell = $("ntShell"), list = $("ntList");
    var frame = $("ntFrame"), title = $("ntTitle"), blurb = $("ntBlurb"), page = $("ntPage");
    var current = -1, turn = 0;

    list.innerHTML = NOTES.map(function (n, i) {
      return '<button class="nt-item" type="button" data-i="' + i + '" aria-current="false">' +
        '<span class="n">' + String(i + 1).padStart(2, "0") + "</span>" +
        "<span>" + Shell.esc(n.topic) + "</span></button>";
    }).join("");

    function show(i) {
      if (i === current) return;
      current = i;
      var n = NOTES[i];
      title.textContent = n.topic;
      blurb.textContent = n.blurb;
      page.textContent = String(i + 1).padStart(2, "0") + " / " +
                         String(NOTES.length).padStart(2, "0");
      /* replace rather than reassign src: a fresh iframe avoids adding a history
         entry per deck, so Back leaves the notes instead of walking the decks */
      frame.innerHTML = '<iframe src="' + n.embed + '" title="' + Shell.esc(n.topic) +
        '" allow="fullscreen"></iframe>';
      /* Some browsers and privacy settings refuse third-party frames outright.
         If the frame has not reported a load shortly, offer the deck directly
         rather than leaving a black rectangle. */
      var f = frame.firstChild, ok = false, mine = ++turn;
      f.addEventListener("load", function () { ok = true; });
      setTimeout(function () {
        if (ok || mine !== turn || !frame.firstChild) return;
        frame.insertAdjacentHTML("beforeend",
          '<div class="nt-fallback"><p>This deck could not be displayed here — your browser ' +
          'may be blocking embedded content.</p><a href="' + n.embed.replace(/\?.*$/, "") +
          '" target="_blank" rel="noopener">Open the deck in a new tab</a></div>');
      }, 6000);
      [].forEach.call(list.children, function (b, k) {
        b.setAttribute("aria-current", String(k === i));
      });
    }

    list.addEventListener("click", function (e) {
      var b = e.target.closest(".nt-item");
      if (b) show(+b.dataset.i);
    });

    function engage(i, focus) {
      boot.hidden = true;
      shell.hidden = false;
      show(i === undefined ? 0 : i);   /* takes an index so a deep link does not
                                          load deck 0's embed before the real one */
      if (focus) {
        var first = list.querySelector(".nt-item");
        if (first) first.focus();
      }
    }

    /* The boot screen is an intro, not a gate. It used to wait for a click,
       which meant a visitor landed on an empty dark panel and saw no notes at
       all unless they guessed to press it. It now clears itself; clicking just
       skips ahead, and reduced-motion users never see it. */
    $("ntPower").addEventListener("click", function () { engage(undefined, true); });
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      engage();
    } else {
      setTimeout(function () { if (!boot.hidden) engage(); }, 900);
    }

    /* Deep link: notes.html#joins opens that deck. Also on hashchange — moving
       between hashes on the same page does not reload it, so a load-time check
       alone would silently do nothing. */
    function fromHash() {
      var slug = decodeURIComponent(location.hash.slice(1)).toLowerCase();
      if (!slug) return;
      var hit = NOTES.findIndex(function (n) {
        return n.topic.toLowerCase().replace(/[^a-z]+/g, "-") === slug;
      });
      if (hit > -1) engage(hit);
    }
    addEventListener("hashchange", fromHash);
    fromHash();
  })();
</script>
</body>
</html>
