<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture notes — PostgreSQL Master</title>
<meta name="description" content="The slide decks handed out alongside the lectures: data modelling, joins, set operations, subqueries and normalisation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234d9bff' stroke-width='2'%3E%3Cellipse cx='12' cy='5.5' rx='8' ry='3'/%3E%3Cpath d='M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/theme.css">
<style>
  .notegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:18px}
  .notecard{
    display:flex; flex-direction:column; gap:9px; text-decoration:none;
    background:var(--white); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:22px 24px; box-shadow:var(--shadow); color:inherit;
    transition:border-color .16s ease, transform .16s ease, box-shadow .16s ease;
  }
  .notecard:hover{border-color:var(--accent-line); transform:translateY(-2px); box-shadow:var(--shadow-lift)}
  .notecard .top{display:flex; align-items:center; gap:10px}
  .notecard .n{
    font-family:var(--mono); font-size:11.5px; font-weight:700;
    background:var(--accent-wash); color:var(--accent-deep);
    border:1px solid var(--accent-line); border-radius:var(--r-sm); padding:2px 7px;
  }
  .notecard h2{font-size:18px; font-weight:600; flex:1; min-width:0}
  .notecard .arw{color:var(--accent-deep); font-size:15px}
  .notecard p{font-size:14.5px; color:var(--ink-2); margin:0}
  .notecard .where{
    font-size:12px; color:var(--ink-3); font-family:var(--mono);
    border-top:1px solid var(--line-soft); padding-top:9px; margin-top:auto;
  }
  .notecard .where b{color:var(--accent-deep); font-weight:700}
</style>
</head>
<body class="app">

<header data-shell></header>

<div data-ctx></div>

<main class="band">
  <div class="wrap">
    <div class="notegrid" id="notegrid"></div>
  </div>
</main>

<footer data-shell></footer>

<script src="assets/shell.js"></script>
<script src="assets/notes.js"></script>
<script>
  Shell.mount("notes");
  Shell.ctx("notes");

  var STEP_LABEL = { subqueries: "Step 03 · Subqueries" };

  document.getElementById("notegrid").innerHTML = NOTES.map(function (n, i) {
    var where = n.step && STEP_LABEL[n.step]
      ? '<div class="where">Also under <b>About this step</b> on ' + Shell.esc(STEP_LABEL[n.step]) + "</div>"
      : "";
    return '<a class="notecard" href="' + n.url + '" target="_blank" rel="noopener">' +
      '<div class="top"><span class="n">' + String(i + 1).padStart(2, "0") + "</span>" +
      "<h2>" + Shell.esc(n.topic) + '</h2><span class="arw" aria-hidden="true">↗</span></div>' +
      "<p>" + Shell.esc(n.blurb) + "</p>" + where + "</a>";
  }).join("");
</script>
</body>
</html>
