<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subqueries — PostgreSQL Master</title>
<meta name="description" content="Subqueries taken apart one row at a time: as the trace steps forward, exactly the rows the inner query touches light up in the dataset.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230066e8' stroke-width='2'%3E%3Cellipse cx='12' cy='5.5' rx='8' ry='3'/%3E%3Cpath d='M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/subqueries.css">
<style>
  /* the walkthrough was a full-viewport slide; inside the shell it becomes a
     bounded panel that keeps its own internal scrolling */
  .sqmod{
    background:var(--white); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,.06);
  }
  .sqmod{flex:1; min-height:0; display:flex; flex-direction:column}
  .sqmod .app{height:100%; min-height:0}
  .sqmod:fullscreen{border:0; border-radius:0}
  .sqmod:fullscreen .app{height:100vh; max-height:none}
  @media (max-width:900px), (max-height:600px){
    .sqmod{display:block}
    .sqmod .app{height:auto; min-height:0}
  }
  </style>
</head>
<body class="fixed">

<header data-shell></header>

<div data-ctx></div>

<main>
<div class="fillhost">
  <div class="wrap">
    <div class="sqmod" id="sqmod">

<div class="app">
  <header class="top">
    <div class="brand"><b>Inner Query, Outer Query</b><span>Subqueries · PostgreSQL 16</span></div>
    <nav class="chips" id="chips"></nav>
    <button class="fs" id="fs" type="button" title="Full screen (F)" aria-label="Enter full screen">
      <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g id="fsIn"><path d="M3 7.5V3h4.5M16.5 7.5V3H12M3 12.5V17h4.5M16.5 12.5V17H12"/></g>
        <g id="fsOut" hidden><path d="M7.5 3v4.5H3M12 3v4.5h4.5M7.5 17v-4.5H3M12 17v-4.5h4.5"/></g>
      </svg>
      <span id="fsLabel">Full screen</span>
    </button>
  </header>
  <main class="stage">
    <aside class="data" id="data"><div class="data-head"><span>The dataset</span><em id="hlnote"></em></div></aside>
    <section class="pane" id="pane"><div class="pane-in" id="paneIn"></div></section>
  </main>
  <footer class="bot">
    <button class="nav" id="prev" type="button">← Back</button>
    <span class="crumb" id="crumb"></span>
    <span class="credit"><b>Innovation in Education</b><i>—</i>Satyaki Das</span>
    <button class="nav" id="next" type="button">Next →</button>
    <span class="hint">← → move · F full screen</span>
  </footer>
</div>
    </div>
  </div>
</div>
</main>

<footer data-shell></footer>

<script src="assets/shell.js"></script>
<script>
  Shell.mount("subqueries");
  Shell.ctx("subqueries");
</script>
<script src="assets/subqueries.js"></script>
</body>
</html>
